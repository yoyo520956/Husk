name: Husk CN build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cn

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Build CN IPA
        run: bash ./scripts/build_cn.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: husk-cn-ipa
          path: Husk-3.0-cn.ipa
          if-no-files-found: error
